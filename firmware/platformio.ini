; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
    zinggjm/GxEPD2
    bblanchon/ArduinoJson

; Test firmware that shows every activity icon with its sport type name.
; Flash with: pio run -e icon-test -t upload
; PC preview without flashing: tools/icon_overview/pc/run.sh
[env:icon-test]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/icon_overview/device/>
